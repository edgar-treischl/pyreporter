[project]
name = "pyreporter"
version = "0.1.0"
description = "Some description."
authors = [
    {name = "edgar.treischl",email = "edgar.treischl@isb.bayern.de"}
]
packages = [
    { include = "pyreporter", from = "src" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.0.0,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "plotnine (>=0.15.3,<0.16.0)",
    "mizani (>=0.14.4,<0.15.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "nbclient (>=0.10.4,<0.11.0)",
    "quarto (>=0.1.0,<0.2.0)",
    "papermill (>=2.6.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
docs = [
    "great-docs (>=0.9,<0.10)"
]
