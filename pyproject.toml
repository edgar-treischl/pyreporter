[project]
name = "pyreporter"
version = "0.1.0"
description = "Some description."
authors = [
    { name = "edgar.treischl", email = "edgar.treischl@isb.bayern.de" },
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0",
    "requests>=2.32",
    "python-dotenv>=1.1",
    "plotnine>=0.15",
    "mizani>=0.14",
    "pyyaml>=6.0",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "quarto>=0.1",
    "papermill>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
]

[dependency-groups]
test = [
    "pytest>=9",
    "pytest-cov>=7",
    "syrupy>=6",
]

dev = [
    "ipykernel>=7.2",
]
docs = [
    "great-docs>=0.9,<0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyreporter"]


[tool.pytest.ini_options]
testpaths = ["tests"]
